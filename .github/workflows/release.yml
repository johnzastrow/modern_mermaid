name: Release

# Push a tag "vX.Y.Z" that matches package.json to publish a release:
#   1. verify: the tag matches package.json; lint, tests, build and audit pass
#   2. images: signed, attested and scanned images tagged X.Y.Z, X.Y and latest
#   3. release: static build zip, source archive, SBOMs and SHA256SUMS, with
#      build provenance, attached to a GitHub Release whose notes come from
#      CHANGELOG.md
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the tag and the build
    runs-on: ubuntu-latest
    # Add required reviewers to this environment in the repository settings to
    # make every release wait for a manual approval.
    environment: release
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Tagged commit must be on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::release tags must point at a commit on main"; exit 1; }

      - name: Tag must match package.json and have a changelog entry
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$version" != "$pkg" ]; then
            echo "::error::tag $TAG does not match package.json version $pkg"; exit 1
          fi
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no [$version] entry"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high

  images:
    needs: verify
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/_images.yml
    with:
      tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=raw,value=latest

  release:
    name: Publish the GitHub Release
    needs: [verify, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release
      packages: read        # pull the images to generate their SBOMs
      id-token: write       # provenance for the attached files
      attestations: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      APP_IMAGE: ghcr.io/${{ github.repository }}
      THEMES_IMAGE: ghcr.io/${{ github.repository }}-themes
      APP_DIGEST: ${{ needs.images.outputs.app-digest }}
      THEMES_DIGEST: ${{ needs.images.outputs.themes-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package the static build and the source
        run: |
          mkdir -p out
          (cd dist && zip -qr "../out/modern-mermaid-${VERSION}-dist.zip" .)
          git archive --format=tar.gz --prefix="modern-mermaid-${VERSION}/" \
            -o "out/modern-mermaid-${VERSION}-source.tar.gz" "${GITHUB_SHA}"

      - name: SBOM for the source and dependencies
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: out/modern-mermaid-${{ env.VERSION }}-source.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: SBOM for the app image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.APP_IMAGE }}@${{ env.APP_DIGEST }}
          format: spdx-json
          output-file: out/modern-mermaid-${{ env.VERSION }}-image.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: SBOM for the themes image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.THEMES_IMAGE }}@${{ env.THEMES_DIGEST }}
          format: spdx-json
          output-file: out/modern-mermaid-themes-${{ env.VERSION }}-image.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Checksums
        run: cd out && sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      - name: Attest the release files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: out/SHA256SUMS

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<EOF

          ## Container images

          | Image | Digest |
          |---|---|
          | \`${APP_IMAGE}:${VERSION}\` | \`${APP_DIGEST}\` |
          | \`${THEMES_IMAGE}:${VERSION}\` | \`${THEMES_DIGEST}\` |

          Both images are signed with cosign (keyless, GitHub OIDC) and carry SBOM and
          SLSA provenance attestations. Verify before deploying:

          \`\`\`bash
          cosign verify ${APP_IMAGE}@${APP_DIGEST} \\
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/_images.yml@refs/tags/v${VERSION}" \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          gh attestation verify oci://${APP_IMAGE}@${APP_DIGEST} --repo ${GITHUB_REPOSITORY}
          \`\`\`

          Release files: check them with \`sha256sum -c SHA256SUMS\` and
          \`gh attestation verify <file> --repo ${GITHUB_REPOSITORY}\`.
          Deployment guide: [docs/DEPLOYMENT.md](https://github.com/${GITHUB_REPOSITORY}/blob/v${VERSION}/docs/DEPLOYMENT.md).
          EOF

      - name: Create the release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: v${{ env.VERSION }}
          body_path: notes.md
          files: out/*
          fail_on_unmatched_files: true
