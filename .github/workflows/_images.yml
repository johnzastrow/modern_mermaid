# Reusable: build, scan, sign, attest and then tag both container images.
# Called by docker-publish.yml (main -> edge) and release.yml (tags -> semver + latest).
#
# Order matters: images are pushed by digest only (no tag), scanned, signed and
# attested, and only then given their tags. A scan failure therefore never
# leaves a vulnerable image behind a tag such as "latest".
# Every third-party action is pinned to a full commit SHA (version in the comment);
# Dependabot keeps the pins current.
name: Build images

on:
  workflow_call:
    inputs:
      tags:
        description: docker/metadata-action "tags" rules
        required: true
        type: string
    outputs:
      app-digest:
        value: ${{ jobs.images.outputs.app-digest }}
      themes-digest:
        value: ${{ jobs.images.outputs.themes-digest }}

permissions:
  contents: read

jobs:
  images:
    name: Build, scan, sign and tag images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # push to GHCR
      id-token: write       # keyless cosign signing and provenance (OIDC)
      attestations: write   # GitHub build provenance attestations
    outputs:
      app-digest: ${{ steps.app.outputs.digest }}
      themes-digest: ${{ steps.themes.outputs.digest }}
    env:
      APP_IMAGE: ghcr.io/${{ github.repository }}
      THEMES_IMAGE: ghcr.io/${{ github.repository }}-themes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # ---- frontend ----
      - name: App metadata
        id: meta_app
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.APP_IMAGE }}
          tags: ${{ inputs.tags }}

      - name: Build and push app by digest
        id: app
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          outputs: type=image,name=${{ env.APP_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta_app.outputs.labels }}
          # BuildKit SBOM and max-mode SLSA provenance, stored with the image.
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      # ---- themes backend ----
      - name: Themes metadata
        id: meta_themes
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.THEMES_IMAGE }}
          tags: ${{ inputs.tags }}

      - name: Build and push themes backend by digest
        id: themes
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./server
          outputs: type=image,name=${{ env.THEMES_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta_themes.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=themes
          cache-to: type=gha,mode=max,scope=themes

      # ---- vulnerability gate ----
      # Fails the run on fixable HIGH/CRITICAL findings, before anything is signed
      # or tagged. For a release this also stops the GitHub Release.
      - name: Scan app image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.APP_IMAGE }}@${{ steps.app.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan themes image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.THEMES_IMAGE }}@${{ steps.themes.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # ---- sign (keyless, by digest) ----
      - name: Sign images with cosign
        env:
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          THEMES_DIGEST: ${{ steps.themes.outputs.digest }}
        run: |
          cosign sign --yes "${APP_IMAGE}@${APP_DIGEST}"
          cosign sign --yes "${THEMES_IMAGE}@${THEMES_DIGEST}"

      - name: Attest app provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.APP_IMAGE }}
          subject-digest: ${{ steps.app.outputs.digest }}
          push-to-registry: true

      - name: Attest themes provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.THEMES_IMAGE }}
          subject-digest: ${{ steps.themes.outputs.digest }}
          push-to-registry: true

      # ---- tag (only after scan, signature and attestations) ----
      # imagetools copies the manifest unchanged, so each tag points at the same
      # digest that was scanned and signed; the check below proves it.
      - name: Tag the images
        env:
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          THEMES_DIGEST: ${{ steps.themes.outputs.digest }}
          APP_TAGS: ${{ steps.meta_app.outputs.tags }}
          THEMES_TAGS: ${{ steps.meta_themes.outputs.tags }}
        run: |
          promote() {
            local image="$1" digest="$2" tags="$3" args=() t got
            while IFS= read -r t; do [ -n "$t" ] && args+=(-t "$t"); done <<< "$tags"
            docker buildx imagetools create "${args[@]}" "${image}@${digest}"
            while IFS= read -r t; do
              [ -n "$t" ] || continue
              got="$(docker buildx imagetools inspect "$t" --format '{{json .Manifest.Digest}}' | tr -d '"')"
              if [ "$got" != "$digest" ]; then
                echo "::error::$t points at $got, expected $digest"; exit 1
              fi
              echo "$t -> $digest"
            done <<< "$tags"
          }
          promote "$APP_IMAGE" "$APP_DIGEST" "$APP_TAGS"
          promote "$THEMES_IMAGE" "$THEMES_DIGEST" "$THEMES_TAGS"
