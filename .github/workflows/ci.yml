name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs (version in the comment).
jobs:
  build:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # Includes the theme backend's tests (server/*.test.mjs).
      - run: pnpm test

      - run: pnpm build

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Only Chromium: these tests cover rendering and download plumbing that
      # jsdom cannot do at all, not cross-browser differences. Adding engines
      # would triple the runtime for very little extra signal.
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # playwright.config.ts serves the production build via `vite preview`,
      # so the browser tests exercise the same artifact the container ships.
      - run: pnpm build

      - run: pnpm typecheck:e2e

      - run: pnpm test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Build and scan container images
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build images
        run: |
          docker build -t modern-mermaid:ci .
          docker build -t modern-mermaid-themes:ci ./server

      - name: Check the nginx config
        run: docker run --rm modern-mermaid:ci nginx -t

      - name: Smoke-test the hardened compose stack
        env:
          MM_PORT: "18080"
        run: |
          docker compose up -d --build --wait
          curl -fsS http://127.0.0.1:18080/ >/dev/null
          test "$(curl -s http://127.0.0.1:18080/api/themes/status)" = '{"writable":false}'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:18080/api/themes)" = 401
          docker compose down -v

      - name: Scan app image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: modern-mermaid:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan themes image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: modern-mermaid-themes:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
