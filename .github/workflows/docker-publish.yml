name: Publish edge images

# Every push to main publishes signed images tagged "edge" and "sha-<short>".
# "latest" and version tags are published only by release.yml, so a deployment
# pinned to a release (or to latest) never picks up unreleased main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-images
  cancel-in-progress: true

jobs:
  images:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/_images.yml
    with:
      tags: |
        type=edge,branch=main
        type=sha,format=short
