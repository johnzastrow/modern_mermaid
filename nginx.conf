# This file is included inside nginx's http {} block (conf.d/default.conf), so the
# map, limit_req_zone and real_ip directives below are valid at this level.

# --- Client address behind the TLS reverse proxy ---
# The container is meant to sit behind Caddy (or another proxy) and to be bound
# to 127.0.0.1 on the host, so only that proxy can reach it. Trust its
# X-Forwarded-For from private ranges only, so rate limits apply per real client.
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# --- Rate limits ---
# General API reads, and a much tighter budget for writes (PUT only; the empty
# key for other methods means they are not counted against the write zone).
map $request_method $api_write_key {
    PUT     $binary_remote_addr;
    default "";
}
limit_req_zone $binary_remote_addr zone=api:10m       rate=10r/s;
limit_req_zone $api_write_key      zone=api_write:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=static:10m    rate=50r/s;
limit_req_status 429;

# Cap concurrent connections per client so one address cannot hold them all open.
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_conn_status 429;

server {
    listen       8080;
    listen  [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Don't advertise the nginx version.
    server_tokens off;
    limit_conn perip 30;

    # Static app: nothing but /api/ accepts a body.
    client_max_body_size 16k;
    client_body_timeout   10s;
    client_header_timeout 10s;
    send_timeout          10s;

    # --- Security headers (defense in depth for a self-hosted static app) ---
    # NOTE: nginx drops all inherited `add_header` directives inside any block
    # that declares its own. To keep these headers on every response, the
    # cache-control locations below use `expires` (which does NOT reset them)
    # rather than `add_header Cache-Control`. HSTS belongs on the TLS proxy.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), usb=()" always;
    # Strict CSP: no external origins. 'unsafe-inline' is required only for
    # styles (inline style attributes + Mermaid-injected <style>); scripts are
    # 'self' only because the service worker registers via an external script.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;

    # --- Theme-persistence API ---
    # Proxy same-origin /api/* to the themes backend on the compose network.
    # Using a variable (not a bare upstream name) with Docker's embedded DNS
    # resolver means nginx starts even when the backend is absent -- requests
    # to /api simply 502 and the frontend falls back to localStorage.
    # Authorization (the owner's write token) is passed through unchanged; the
    # backend decides whether a write is allowed.
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        # The client coalesces rapid saves, so 10 queued writes is generous.
        limit_req zone=api_write burst=10 nodelay;
        limit_except GET HEAD PUT { deny all; }
        client_max_body_size 4m;

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $themes_backend http://themes-backend:8090;
        proxy_pass $themes_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_connect_timeout 3s;
    }

    # SPA fallback
    location / {
        limit_req zone=static burst=100 nodelay;
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ /index.html;
    }

    # Long-cache content-hashed build assets (expires keeps security headers)
    location /assets/ {
        limit_except GET HEAD { deny all; }
        expires 1y;
    }

    # Never cache the entry document or the service worker
    location = /index.html { limit_except GET HEAD { deny all; } expires -1; }
    location = /sw.js       { limit_except GET HEAD { deny all; } expires -1; }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
}
